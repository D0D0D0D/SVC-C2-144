[project]
name = "svc-c2-144"
version = "1.0.0"
description = "ChangeFreezeExceptionReviewAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    # PB-7 stub の _hitl_enabled() は `import yaml` を except で握りつぶす。pyyaml が無いと
    # HITL 有効でも PB-7 が黙って SKIPPED になる（偽の緑）。HITL テンプレは必ず exact pin する。
    "pyyaml==6.0.1",
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
# 写経部品は上流 parts/ master が管理する byte-identical な資産。ローカルで整形すると
# verify_part.py の IDENTICAL 判定（写経忠実性の機械照合）が壊れる。整形は上流で行う。
# formatter 固有の exclude は global の既定除外に追加され、lint の検査対象は狭めない。
exclude = [
    "src/cat2_graph_skeleton/**",
    "src/entry_adapter/**",
    "src/evidence_gate/**",
    "src/ingest_row_pipeline/**",
    "src/llm_draft_stage/**",
    "src/output_envelope/**",
    "src/payload_store/**",
]

[tool.mypy]
python_version = "3.11"
strict = true

# AgentCore SDK 1.0.1 does not publish `py.typed`, so framework base classes
# resolve to Any even though the runtime objects are present. Strict mypy then
# rejects every required L1 subclass structurally. Relax only that one strict
# check; all other strict checks remain enabled and template-owned code is
# still type-checked. A local .pyi overlay would be worse: it can drift from
# the installed SDK and make security declarations look checked when they are
# not checked against the real implementation.
disallow_subclassing_any = false

# These directories are byte-identical copies from the upstream parts master.
# Type fixes belong upstream; adding annotations locally would break
# verify_part.py identity. Template-owned integrations around the parts remain
# in scope and must satisfy strict mypy.
exclude = [
    "^src/cat2_graph_skeleton/",
    "^src/entry_adapter/",
    "^src/evidence_gate/",
    "^src/ingest_row_pipeline/",
    "^src/llm_draft_stage/",
    "^src/output_envelope/",
    "^src/payload_store/",
]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*", "yaml"]
# Approved handling for dependencies that ship no typing metadata. Keep them
# as honest Any values instead of maintaining signature guesses in local stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.graph.*", "src.nodes.*"]
# `mypy --strict` re-enables this command-line flag after reading the global
# setting. Repeat the same single exception only for modules that directly
# subclass the untyped SDK; this keeps the documented CI (`mypy src/`) and the
# stricter review reproduction command consistent.
disallow_subclassing_any = false
